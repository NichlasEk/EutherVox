[server]
host = "0.0.0.0"
port = 8788
text_logging = true
response_timeout_seconds = 15.0

[audio.input]
sample_rate = 16000
channels = 1
frame_ms = 20

[audio.output]
sample_rate = 24000
channels = 1
buffer_ms = 120

[character]
default = "skinnskattaren"
profile_dir = "characters"

[stt]
provider = "mock"

[llm]
provider = "mock"

[tts]
provider = "mock"

[youtube]
enabled = false

[playlists]
directory = "state/playlists"

[cast]
enabled = false
backend = "youtube_controller"
operation_timeout_seconds = 18

[mcp]
enabled = false
planner_timeout_seconds = 8

[wikipedia]
enabled = false
api_url = "https://sv.wikipedia.org/w/api.php"
timeout_seconds = 8
max_attempts = 2
max_extract_chars = 6000

[conversation]
history_turns = 10
max_history_chars = 12000
