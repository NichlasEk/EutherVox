[server]
host = "0.0.0.0"
port = 8788
text_logging = true
response_timeout_seconds = 15.0

[audio.input]
sample_rate = 16000
channels = 1
frame_ms = 20

[audio.output]
sample_rate = 24000
channels = 1
buffer_ms = 120

[character]
default = "skinnskattaren"
profile_dir = "characters"

[stt]
provider = "mock"

[llm]
provider = "mock"

[tts]
provider = "mock"

[youtube]
enabled = false

[playlists]
directory = "state/playlists"

[cast]
enabled = false
backend = "youtube_controller"
operation_timeout_seconds = 18

[mcp]
enabled = false
planner_timeout_seconds = 8

[lights]
enabled = false
config_file = "state/lights.toml"
timeout_seconds = 2

[television]
enabled = false
config_file = "state/tvs.toml"
scan_network = "192.168.32.0/24"
timeout_seconds = 1.5
scan_concurrency = 32

[eutherpump]
enabled = false
base_url = "http://127.0.0.1:8794"
timeout_seconds = 2

[[eutherpump.pumps]]
id = "vardagsrum"
name = "Värmepumpen"
room = "vardagsrummet"

[wikipedia]
enabled = false
api_url = "https://sv.wikipedia.org/w/api.php"
timeout_seconds = 8
max_attempts = 2
max_extract_chars = 6000

[conversation]
history_turns = 10
max_history_chars = 12000

[printer]
enabled = false
status_url = "https://apothictech.se/euthershould/api/printer-service"
allowed_users = []
# token_file = "/private/path/printer-service-token"
