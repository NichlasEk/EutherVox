[server]
host = "0.0.0.0"
port = 8788
text_logging = true
response_timeout_seconds = 30.0

[audio.input]
sample_rate = 16000
channels = 1
frame_ms = 20

[audio.output]
sample_rate = 22050
channels = 1
buffer_ms = 120

[character]
default = "skinnskattaren"
profile_dir = "characters"

[stt]
provider = "faster_whisper"
# Conversation default: accurate Swedish with low latency on an NVIDIA GPU.
model = "small"
device = "cuda"
compute_type = "float16"
language = "sv"
cpu_threads = 8
download_root = "models/faster-whisper"
# Add domain words only after measuring them; broad hotword lists can bias ordinary phrases.
hotwords = ""
# Keep voice control available after a driver update until the host is rebooted.
fallback_model = "base"
fallback_compute_type = "int8"

[llm]
provider = "ollama"
base_url = "http://127.0.0.1:11434"
model = "qwen3:4b-instruct"
models = ["qwen3:4b-instruct", "qwen3.8:27b"]
think = false
timeout_seconds = 30.0

[tts]
provider = "router"
default_voice = "piper-nst"
fallback_voice = "piper-nst"
frame_ms = 20

[tts.voices.piper-nst]
provider = "piper"
model_path = "models/piper/sv_SE-nst-medium.onnx"

[tts.voices.piper-lisa]
provider = "piper"
model_path = "models/piper/sv_SE-lisa-medium.onnx"

[tts.voices.chatterbox]
provider = "http_pcm"
base_url = "http://127.0.0.1:8790"
sample_rate = 22050
timeout_seconds = 20
normalize_pronunciation = false

[tts.voices.moss-nano]
provider = "http_pcm"
base_url = "http://127.0.0.1:8791"
sample_rate = 22050
timeout_seconds = 20
normalize_pronunciation = true
profile = "skinnskattaren"

[tts.voices.moss-christian]
provider = "http_pcm"
base_url = "http://127.0.0.1:8791"
sample_rate = 22050
timeout_seconds = 20
normalize_pronunciation = true
profile = "christian"

[tts.voices.matcha-sherlock]
provider = "http_pcm"
base_url = "http://127.0.0.1:8793"
sample_rate = 22050
timeout_seconds = 15
normalize_pronunciation = true
profile = "sherlock"

[youtube]
# OAuth-hemligheter läses från miljön och får aldrig läggas i denna fil.
enabled = true
client_id_env = "EUTHERVOX_GOOGLE_CLIENT_ID"
client_secret_env = "EUTHERVOX_GOOGLE_CLIENT_SECRET"
redirect_uri = "https://apothictech.se/euthervox/oauth/callback"
token_directory = "state/youtube-tokens"
playlist_size = 15

[playlists]
directory = "state/playlists"

[cast]
enabled = true
backend = "direct_audio"
default_room = "köket"
timeout_seconds = 8
operation_timeout_seconds = 18
resolver_timeout_seconds = 20
playback_confirmation_seconds = 8

[mcp]
enabled = true
planner_timeout_seconds = 8

[lights]
enabled = true
config_file = "state/lights.toml"
timeout_seconds = 2

[television]
enabled = true
config_file = "state/tvs.toml"
# Begränsa sökningen till TV:ns privata /24-nät.
scan_network = "192.168.32.0/24"
timeout_seconds = 1.5
scan_concurrency = 32

[eutherpump]
enabled = true
base_url = "http://192.168.32.186:18082"
timeout_seconds = 2

[[eutherpump.pumps]]
id = "08a4cfb2-0da9-4699-9f40-2d988ec3c709"
name = "Värmepumpen"
room = "vardagsrummet"

[wikipedia]
enabled = true
api_url = "https://sv.wikipedia.org/w/api.php"
timeout_seconds = 8
max_attempts = 2
max_extract_chars = 6000

[conversation]
history_turns = 10
max_history_chars = 12000

[cast.rooms."köket"]
friendly_name = "Kök 2"
host = "192.168.32.5"
port = 8009
uuid = "513b23e1-0384-d9e8-8eeb-c31f9c7b656e"
model_name = "Google Nest Mini"
