[project]
name = "euthervox-gateway"
version = "0.1.0"
description = "Local streaming voice gateway for EutherVox"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "websockets>=14,<17",
    "httpx>=0.28,<1",
    "pychromecast>=14,<16",
    "yt-dlp[default]>=2026.8.19,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
real = [
    "faster-whisper>=1.1,<2",
    "piper-tts>=1.6,<2",
]
cuda = [
    "nvidia-cublas-cu12>=12.4,<13",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
euthervox-gateway = "gateway.main:cli"
euthervox-mcp = "gateway.mcp_server:cli"

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/gateway"]
